<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f2a"/>
      <stop offset="100%" style="stop-color:#111418"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0C860"/>
      <stop offset="100%" style="stop-color:#D4A843"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Gold ring accent -->
  <rect width="100" height="100" rx="22" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.5"/>
  <!-- Milk bottle shape -->
  <g transform="translate(50,50)">
    <!-- Bottle body -->
    <rect x="-14" y="-8" width="28" height="34" rx="6" fill="url(#gold)"/>
    <!-- Bottle neck -->
    <rect x="-8" y="-22" width="16" height="16" rx="4" fill="url(#gold)"/>
    <!-- Bottle cap -->
    <rect x="-9" y="-28" width="18" height="8" rx="3" fill="#D4A843"/>
    <!-- Highlight -->
    <rect x="-10" y="-6" width="5" height="20" rx="2.5" fill="rgba(255,255,255,0.25)"/>
    <!-- Milk droplets -->
    <circle cx="14" cy="8" r="4" fill="rgba(255,255,255,0.9)"/>
    <circle cx="18" cy="16" r="2.5" fill="rgba(255,255,255,0.7)"/>
    <circle cx="12" cy="20" r="2" fill="rgba(255,255,255,0.6)"/>
  </g>
</svg>
