name = "print-manager-ocr"
main = "worker-ocr.js"
compatibility_date = "2024-01-01"

# R2 Bucket Binding (optional - for file uploads)
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "orders"

# Environment Variables (set via: wrangler secret put OPENROUTER_API_KEY)
# - OPENROUTER_API_KEY: Your OpenRouter API key (required for OCR)
# Get your key from: https://openrouter.ai/keys

[vars]
ENVIRONMENT = "production"

# Development
[dev]
port = 8787
local_protocol = "http"
